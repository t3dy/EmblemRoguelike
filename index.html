<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Emblem Knight — and the Alchemical Dragon</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="frame">
    <div id="stage">
      <canvas id="game" width="768" height="576"></canvas>
    </div>
    <div id="touch">
      <div class="dpad8">
        <button data-keys="ArrowUp,ArrowLeft"    class="db nw" title="up-left">↖</button>
        <button data-key="ArrowUp"               class="db up">▲</button>
        <button data-keys="ArrowUp,ArrowRight"   class="db ne" title="up-right">↗</button>
        <button data-key="ArrowLeft"             class="db left">◀</button>
        <span class="db mid"></span>
        <button data-key="ArrowRight"            class="db right">▶</button>
        <button data-keys="ArrowDown,ArrowLeft"  class="db sw" title="down-left">↙</button>
        <button data-key="ArrowDown"             class="db down">▼</button>
        <button data-keys="ArrowDown,ArrowRight" class="db se" title="down-right">↘</button>
      </div>
      <div class="acts">
        <button data-key="x" class="ab" title="cancel/back">B</button>
        <button data-key="z" class="ab" title="confirm">A</button>
        <button data-key="p" class="sb" title="menu">☰</button>
        <button data-key="n" class="sb" title="next fugue">&#9835;</button>
      </div>
    </div>
    <p id="hint">Move: Arrows / WASD (hold two for diagonals) &nbsp;•&nbsp; Z confirm &nbsp;•&nbsp; X back &nbsp;•&nbsp; Esc/P menu (Save&nbsp;&amp;&nbsp;Quit) &nbsp;•&nbsp; M mute &nbsp;•&nbsp; N next fugue</p>
  </div>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Emblem Knight — Asset Codex</title>
<style>
  :root { --bg:#0c0a14; --panel:#1a1530; --edge:#6a5db0; --ink:#e8e2cc; --gold:#ffe08a; --dim:#9a93b8; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(circle at 50% 0%, #221a33, #0c0a14 70%);
    color: var(--ink); font-family: "Georgia", serif; padding: 0 0 60px;
  }
  header { text-align: center; padding: 28px 16px 12px; }
  h1 { margin: 0; font-size: 30px; color: var(--gold); letter-spacing: 1px; }
  .sub { color: var(--dim); margin-top: 6px; font-size: 14px; }
  .sub a { color: var(--edge); }
  .controls { position: sticky; top: 0; z-index: 5; background: rgba(12,10,20,0.92);
    backdrop-filter: blur(4px); padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; align-items: center; border-bottom: 1px solid #2a2444; }
  .filter { background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 16px; padding: 6px 14px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .filter.active { background: var(--edge); color: #fff; }
  #search { background: var(--panel); color: var(--ink); border: 1px solid var(--edge);
    border-radius: 16px; padding: 6px 14px; font-size: 13px; min-width: 180px; font-family: inherit; }
  .count { color: var(--dim); font-size: 12px; width: 100%; text-align: center; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 14px; padding: 18px; max-width: 1280px; margin: 0 auto; }
  .card { background: linear-gradient(180px, #efe0bb, #d9c08a); border: 3px solid #5b4226;
    border-radius: 6px; padding: 10px; color: #2a2118; box-shadow: 0 6px 18px rgba(0,0,0,.45);
    display: flex; flex-direction: column; }
  .thumb { height: 150px; display: flex; align-items: center; justify-content: center;
    background: repeating-conic-gradient(#cdb888 0% 25%, #c2ab78 0% 50%) 50% / 22px 22px;
    border: 1px solid #8a6a3c; border-radius: 4px; overflow: hidden; }
  .thumb img { max-width: 96%; max-height: 96%; image-rendering: pixelated; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .name { font-weight: bold; font-size: 15px; margin: 8px 0 2px; }
  .role { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    background: #5b4226; color: #f0e2bf; border-radius: 8px; padding: 1px 8px; margin-bottom: 6px; }
  .props { font-size: 12px; line-height: 1.5; }
  .props b { color: #5b4226; }
  .stats { margin-top: 6px; font-size: 12px; background: #00000018; border-radius: 4px; padding: 4px 6px; }
  footer { text-align:center; color: var(--dim); font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<header>
  <h1>⚗ Emblem Knight — Asset Codex</h1>
  <div class="sub">Every sprite in the game, drawn from real early-modern alchemical emblem books.<br>
    <a href="index.html">▶ Play the game</a></div>
</header>
<div class="controls" id="controls">
  <input id="search" placeholder="search name / source…" />
  <span class="count" id="count"></span>
</div>
<div class="grid" id="grid"></div>
<footer>Sprites are derivative crops of public-domain engravings (pre-1700). Music: Maier's Atalanta Fugiens (1617).</footer>

<script type="module">
import { MONSTERS } from './js/data.js';

const KIND_LABEL = {
  hero: 'Character', npc: 'NPC', monster: 'Monster',
  structure: 'Building', terrain: 'Terrain', decor: 'Decor',
};

// humanize a source path into "Corpus, work, plate/emblem"
function source(src) {
  if (!src) return 'Unknown';
  src = src.replace(/\\/g, '/').toLowerCase();
  const m = (re) => { const x = src.match(re); return x ? x[1] : null; };
  if (src.includes('emblem-')) return `Atalanta Fugiens (Maier 1617), Emblem ${+m(/emblem-0*(\d+)/)}`;
  if (src.includes('stolcius_plate')) return `Stolcius, Viridarium Chymicum, Plate ${+m(/plate_0*(\d+)/)}`;
  if (src.includes('cramer_page')) return `Cramer, Emblemata Sacra (1624), p.${+m(/page_0*(\d+)/)}`;
  if (src.includes('splendor_solis')) return 'Splendor Solis (Trismosin)';
  if (src.includes('mclean')) return 'McLean Second Emblem Collection';
  if (src.includes('khunrath')) return 'Khunrath, Amphitheatrum Sapientiae';
  if (src.includes('mylius')) return 'Mylius, Philosophia Reformata';
  if (src.includes('paul_marshall')) return 'Christian Rosenkreutz Anthology';
  if (src.includes('maier_arcana')) return 'Maier, Arcana Arcanissima';
  if (src.includes('rosarium')) return 'Rosarium Philosophorum';
  if (src.includes('obrist')) return 'Obrist, Medieval Alchemical Imagery';
  if (src.includes('fludd')) return 'Fludd, Utriusque Cosmi';
  if (src.includes('hall')) return 'Hall Alchemical Manuscripts';
  return src.split('/').slice(-1)[0];
}

const monBySprite = {};
for (const k in MONSTERS) monBySprite[MONSTERS[k].sprite] = MONSTERS[k];

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const controls = document.getElementById('controls');
let manifest = [], activeKind = 'all', query = '';

function order(k){ return ['hero','npc','monster','structure','terrain','decor'].indexOf(k.kind); }

function render() {
  const items = manifest
    .filter(a => activeKind === 'all' || a.kind === activeKind)
    .filter(a => {
      if (!query) return true;
      const hay = (a.label + ' ' + a.name + ' ' + source(a.src)).toLowerCase();
      return hay.includes(query);
    })
    .sort((a, b) => order(a) - order(b) || a.label.localeCompare(b.label));
  grid.innerHTML = '';
  for (const a of items) {
    const mon = monBySprite[a.name];
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb"><img src="${a.file}" alt="${a.label}"></div>
      <div class="name">${a.label}</div>
      <span class="role">${KIND_LABEL[a.kind] || a.kind}</span>
      <div class="props">
        <div><b>Source:</b> ${source(a.src)}</div>
        <div><b>Sprite:</b> ${a.name} &nbsp; <b>Size:</b> ${a.w}×${a.h}px</div>
      </div>
      ${mon ? `<div class="stats">
        <b>${mon.boss ? '★ BOSS' : 'Foe'}</b> — HP ${mon.hp} · ATK ${mon.atk} · DEF ${mon.def}
        · ${mon.xp} XP · ${mon.gold}g${mon.spell ? ' · casts ' + mon.spell : ''}</div>` : ''}
    `;
    grid.appendChild(card);
  }
  countEl.textContent = `${items.length} of ${manifest.length} assets`;
}

function buildFilters() {
  const kinds = ['all', ...[...new Set(manifest.map(a => a.kind))].sort((a,b)=>order({kind:a})-order({kind:b}))];
  kinds.forEach(k => {
    const b = document.createElement('button');
    b.className = 'filter' + (k === 'all' ? ' active' : '');
    b.textContent = k === 'all' ? 'All' : (KIND_LABEL[k] || k) + 's';
    b.onclick = () => { activeKind = k; document.querySelectorAll('.filter').forEach(x => x.classList.remove('active')); b.classList.add('active'); render(); };
    controls.insertBefore(b, searchEl);
  });
}

searchEl.addEventListener('input', () => { query = searchEl.value.trim().toLowerCase(); render(); });

fetch('assets/manifest.json').then(r => r.json()).then(data => {
  manifest = data.filter(a => a.name !== '_SHEET');
  buildFilters();
  render();
});
</script>
</body>
</html>
